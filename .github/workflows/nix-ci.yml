name: Nix CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install Nix
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Nix store cache (rustup/elan/hax/lean itself, and anything else
      # built into the store while the devShell is active); cachix-action
      # degrades to read-only on PRs since forks don't see repo secrets.
      - uses: cachix/cachix-action@v17
        with:
          name: womeier
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # rustup/cargo (hax's pinned nightly toolchain + crate deps) and the
      # cargo build cache. These live outside the Nix store (see flake.nix's
      # shellHook), so Cachix doesn't cover them.
      - name: Cache Rust toolchain and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .rustup-home
            .cargo-home
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      # elan (Lean toolchain, pinned by proofs/lean/lean-toolchain).
      - name: Cache elan
        uses: actions/cache@v4
        with:
          path: .elan-home
          key: elan-${{ runner.os }}-${{ hashFiles('proofs/lean/lean-toolchain') }}
          restore-keys: |
            elan-${{ runner.os }}-

      # Lake's own build cache (compiled .olean files for aeneas, hax-lean,
      # mathlib and SatSolver itself).
      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: proofs/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('proofs/lean/lake-manifest.json', 'proofs/lean/lean-toolchain') }}
          restore-keys: |
            lake-${{ runner.os }}-

      # Re-extract SatSolver/Extraction/*.lean from src/ via hax, and fail
      # if that produces a diff — catches proofs/lean drifting out of sync
      # with the Rust source it's supposed to be extracted from.
      - name: Extract Lean from Rust (hax)
        run: nix develop --command just extract

      - name: Check extraction is up to date
        run: |
          if [ -n "$(git status --porcelain -- proofs/lean)" ]; then
            echo "::error::proofs/lean is out of date with src/ — run 'just extract' and commit the result."
            git status --porcelain -- proofs/lean
            git diff -- proofs/lean
            exit 1
          fi

      # Pull precompiled mathlib .olean files instead of building it from source.
      - name: Fetch Lean/mathlib cache
        run: nix develop --command bash -c "cd proofs/lean && lake exe cache get"

      # Build aeneas, hax-lean and the SatSolver proof.
      - name: Build Lean proof
        run: nix develop --command bash -c "cd proofs/lean && lake build"
