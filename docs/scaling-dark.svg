<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 476" width="780" height="476" role="img" aria-labelledby="figTitle figDesc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="figTitle">How the three solvers scale with problem size</title>
<desc id="figDesc">Median solve time per instance against the number of variables, on a logarithmic time axis, over SATLIB uniform random 3-SAT at the phase transition (clause to variable ratio 4.26). Satisfiable sets are drawn solid, unsatisfiable dashed. Each instance had a ten-second budget; a curve stops where fewer than half the set fits in it. cdcl on sat sets runs from 57 µs at 20 variables to 1.69 s at 200, about 4.2 times per 25 variables, and at 225 variables solves only 7/25 in the budget. cdcl on unsat sets runs from 604 µs at 50 variables to 1.09 s at 175, about 4.5 times per 25 variables, and at 200 variables solves only 10/25 in the budget. dpll on sat sets runs from 210 µs at 20 variables to 2.89 s at 125, about 9.7 times per 25 variables, and at 150 variables solves only 7/25 in the budget. dpll on unsat sets runs from 12.2 ms at 50 variables to 1.44 s at 100, about 10.8 times per 25 variables, and at 125 variables solves only 7/25 in the budget. naive manages only the 20-variable sat set, at 94.0 ms, and at 50 variables solves only 0/25 in the budget.</desc>
<rect x="0" y="0" width="780" height="476" fill="#1a1a19"/>
<text x="24.0" y="34.0" fill="#ffffff" font-size="15" font-weight="600">How the three solvers scale</text>
<text x="24.0" y="53.0" fill="#c3c2b7" font-size="11.5">Median solve time per instance · SATLIB uniform random 3-SAT at the phase transition (ratio 4.26)</text>
<text x="24.0" y="71.0" fill="#898781" font-size="10.5">Solid: satisfiable.  Dashed: unsatisfiable.  10 s per instance; a curve ends where under half the set fits in that,</text>
<text x="24.0" y="86.0" fill="#898781" font-size="10.5">and its last point says how much of that set it did solve.</text>
