<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 473.0" width="780" height="473.0" role="img" aria-labelledby="figTitle figDesc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="figTitle">SATLIB solve time by solver</title>
<desc id="figDesc">Mean solve time per instance on a logarithmic scale, for three solvers across three SATLIB random 3-SAT sets, 100 instances each. On uf20-91 (20 variables, satisfiable): cdcl 0.056 ms mean and 0.085 ms worst; dpll 0.147 ms mean and 0.446 ms worst; naive 138 ms mean and 422 ms worst. On uf50-218 (50 variables, satisfiable): cdcl 0.322 ms mean, 1.19 ms worst; dpll 4.66 ms mean, 19.0 ms worst. On uuf50-218 (50 variables, unsatisfiable): cdcl 0.589 ms mean, 1.52 ms worst; dpll 12.0 ms mean, 42.8 ms worst. The naive solver is out of reach on the 50-variable sets, since it enumerates all 2^50 valuations.</desc>
