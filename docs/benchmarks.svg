<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 404.0" width="780" height="404.0" role="img" aria-labelledby="figTitle figDesc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="figTitle">SATLIB solve time by solver</title>
<desc id="figDesc">Mean solve time per instance on a logarithmic scale, for two solvers across three SATLIB random 3-SAT sets, 100 instances each. On uf20-91 (20 variables, satisfiable): dpll 0.14 ms mean and 0.43 ms worst; naive 131 ms mean and 386 ms worst. On uf50-218 (50 variables, satisfiable): dpll 4.32 ms mean, 16.5 ms worst. On uuf50-218 (50 variables, unsatisfiable): dpll 12.0 ms mean, 41.4 ms worst. The naive solver is out of reach on the 50-variable sets, since it enumerates all 2^50 valuations.</desc>
