<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 473.0" width="780" height="473.0" role="img" aria-labelledby="figTitle figDesc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="figTitle">SATLIB solve time by solver</title>
<desc id="figDesc">Mean solve time per instance on a logarithmic scale, for three solvers across three SATLIB random 3-SAT sets, 100 instances each. On uf20-91 (20 variables, satisfiable): cdcl 0.060 ms mean, 0.106 ms worst; dpll 0.152 ms mean, 0.476 ms worst; naive 141 ms mean, 507 ms worst. On uf50-218 (50 variables, satisfiable): cdcl 0.345 ms mean, 1.27 ms worst; dpll 4.95 ms mean, 16.6 ms worst. On uuf50-218 (50 variables, unsatisfiable): cdcl 0.634 ms mean, 1.59 ms worst; dpll 12.7 ms mean, 44.1 ms worst. The naive solver is out of reach on the 50-variable sets, since it enumerates all 2^50 valuations.</desc>
